<!DOCTYPE html>
<html>
<head>
<title>Teacher Login</title>
<style>
body{font-family:Arial; display:flex; justify-content:center; align-items:center; height:100vh;}
.box{background:white; padding:20px; width:300px;}
input,button{width:100%; padding:10px; margin:5px 0;}
button{background:black; color:white;}
</style>
</head>

<body>

<div class="box">
<h2>Teacher Login</h2>

<input id="tuser" placeholder="Username">
<input id="tpass" type="password" placeholder="Password">

<button onclick="login()">Login</button>
</div>

<script>
function login(){
let u=document.getElementById("tuser").value;
let p=document.getElementById("tpass").value;

if(u==="admin" && p==="1234"){
window.location.href="teacher-dashboard.html";
} else {
alert("Wrong Teacher Login");
}
}
</script>

</body>
</html>
